services:
  postgres:
    image: postgres:16-alpine
    container_name: arka-payroll-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arka
      POSTGRES_PASSWORD: arka_secret
      POSTGRES_DB: arka_payroll
    ports:
      - "5432:5432"
    volumes:
      - arka_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arka -d arka_payroll"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arka_pg_data:
